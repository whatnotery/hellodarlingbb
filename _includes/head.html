<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{ page.title | default: site.title }}</title>
    <meta
        name="description"
        content="{{ page.description | default: site.description }}"
    />
    <link
        rel="canonical"
        href="{{ site.url | default: 'https://hellodarlingbb.com' }}{{ page.url | relative_url }}"
    />

    <!--  CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
        rel="stylesheet"
        href="{{ '/assets/css/bellasmith.css' | relative_url }}"
    />

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="{{ '/assets/img/favicon.png' | relative_url }}"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta
        property="og:title"
        content="{{ page.title | default: site.title }}"
    />
    <meta
        property="og:description"
        content="{{ page.description | default: site.description }}"
    />
    <meta
        property="og:url"
        content="{{ site.url | default: 'https://hellodarlingbb.com' }}{{ page.url | relative_url }}"
    />
    <meta
        property="og:image"
        content="{{ site.url | default: 'https://hellodarlingbb.com' }}{{ '/assets/img/logo.png' | relative_url }}"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
        name="twitter:title"
        content="{{ page.title | default: site.title }}"
    />
    <meta
        name="twitter:description"
        content="{{ page.description | default: site.description }}"
    />
    <meta
        name="twitter:image"
        content="{{ site.url | default: 'https://hellodarlingbb.com' }}{{ '/assets/img/logo.png' | relative_url }}"
    />

    <script>
        (function (w, d, e, u, f, l, n) {
            ((w[f] =
                w[f] ||
                function () {
                    (w[f].q = w[f].q || []).push(arguments);
                }),
                (l = d.createElement(e)),
                (l.async = 1),
                (l.src = u),
                (n = d.getElementsByTagName(e)[0]),
                n.parentNode.insertBefore(l, n));
        })(
            window,
            document,
            "script",
            "https://assets.mailerlite.com/js/universal.js",
            "ml",
        );
        ml("account", "1780731");
    </script>
</head>
