<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>{{ page.title | default: site.title }}</title>
        <meta
            name="description"
            content="{{ page.description | default: site.description }}"
        />
        <link
            rel="canonical"
            href="{{ site.url | default: 'https://www.hellodarlingbb.com' }}{{ page.url | relative_url }}"
        />

        <!-- Montserrat font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Montserrat", sans-serif;
            }
        </style>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="{{ '/assets/img/logo.png' | relative_url }}"
        />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="{{ site.title }}" />
        <meta
            property="og:title"
            content="{{ page.title | default: site.title }}"
        />
        <meta
            property="og:description"
            content="{{ page.description | default: site.description }}"
        />
        <meta
            property="og:url"
            content="{{ site.url | default: 'https://www.hellodarlingbb.com' }}{{ page.url | relative_url }}"
        />
        <meta
            property="og:image"
            content="{{ '/assets/img/logo.png' | relative_url }}"
        />
        <meta property="og:locale" content="en_US" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary" />
        <meta
            name="twitter:title"
            content="{{ page.title | default: site.title }}"
        />
        <meta
            name="twitter:description"
            content="{{ page.description | default: site.description }}"
        />
        <meta
            name="twitter:image"
            content="{{ site.url | default: 'https://www.hellodarlingbb.com' }}{{ '/assets/img/logo.png' | relative_url }}"
        />
    </head>
    <body class="container mx-auto md:w-3/4 bg-[#f9c1a8] text-[#391d0b]">
        <main
            class="flex min-h-screen flex-col items-center justify-center px-6 py-12"
        >
            <img
                src="{{ '/assets/img/body.png' | relative_url }}"
                alt="{{ site.title }}"
                class="h-auto w-96"
            />

            <section class="mt-10 text-center">
                <p class="mx-auto mt-4 max-w-md text-lg md:text-xl">
                    Opening soon in downtown Lexington at the corner of Elm Tree
                    Lane and Short St <br />
                    <br />
                    <a href="mailto:alex@darlingwinebar.com"
                        ><strong><em>Inquiries</em></strong></a
                    >
                </p>
            </section>
        </main>
    </body>
</html>
