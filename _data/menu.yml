wine:
  red:
    - producer: "Castello di Verrazzano"
      country: "Italy"
      region: "Chianti Classico"
      grape: "Sangiovese"
      notes: "Bright cherry, dried herbs, and earthy tannins"
    - producer: "Bodegas Roda"
      country: "Spain"
      region: "Rioja"
      grape: "Tempranillo"
      notes: "Vanilla, blackberry, and leather with smooth oak integration"
    - producer: "Domaine Serene"
      country: "USA"
      region: "Willamette Valley"
      grape: "Pinot Noir"
      notes: "Red berry, cola, and forest floor with silky texture"
    - producer: "Penfolds"
      country: "Australia"
      region: "Barossa Valley"
      grape: "Shiraz"
      notes: "Black pepper, dark plum, and chocolate with bold structure"

  white:
    - producer: "Trimbach"
      country: "France"
      region: "Alsace"
      grape: "Riesling"
      notes: "Steely minerality, green apple, and citrus zest"
    - producer: "Kumeu River"
      country: "New Zealand"
      region: "Auckland"
      grape: "Chardonnay"
      notes: "White peach, toasted hazelnut, and creamy texture"
    - producer: "Weingut Dr. Loosen"
      country: "Germany"
      region: "Mosel"
      grape: "Riesling"
      notes: "Off-dry with lime, slate, and honeyed finish"
    - producer: "Rombauer Vineyards"
      country: "USA"
      region: "Carneros"
      grape: "Chardonnay"
      notes: "Buttery, vanilla, and tropical fruit with rich mouthfeel"

  orange:
    - producer: "Principiano"
      country: "Italy"
      region: "Piedmont"
      grape: "Nascetta"
      notes: "Amber-hued, wild orange peel, chamomile, and oxidative depth"

  rose:
    - producer: "Château Minuty"
      country: "France"
      region: "Côtes de Provence"
      grape: "Grenache/Cinsault"
      notes: "Pale pink, strawberry, white flowers, and crisp acidity"

  sparkling:
    - producer: "Schramsberg"
      country: "USA"
      region: "Napa Valley"
      grape: "Chardonnay/Pinot Noir"
      notes: "Brioche, green apple, and fine persistent bubbles"

  sweet:
    - producer: "Kracher"
      country: "Austria"
      region: "Neusiedlersee"
      grape: "Welschriesling"
      notes: "Luscious honey, apricot, and botrytis spice"

cocktails:
    - name: "Old Fashioned"
      notes: "Bourbon, sugar, bitters, orange twist"
    - name: "Negroni"
      notes: "Gin, Campari, sweet vermouth, orange peel"
    - name: "Margarita"
      notes: "Tequila, lime juice, Cointreau, salt rim"
    - name: "Daiquiri"
      notes: "White rum, fresh lime juice, simple syrup"
    - name: "Smoked Maple Sour"
      notes: "Bourbon, maple syrup, lemon juice, smoked salt"
    - name: "Garden Spritz"
      notes: "Elderflower liqueur, prosecco, cucumber, mint"
